<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>전구 불 켜기 탐구</title>
<style>
:root{
  /* 레이아웃: 위 진행 표시줄 · 한 화면에 한 단계 · 아래 이전/다음 버튼 */
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bg:#EDF3F8; --surface:#FFFFFF; --surface2:#E2ECF4; --ink:#14212E; --ink2:#3D4F63; --muted:#566A80; --line:#C6D6E3;
  --brand:#1D5FA8; --brand-ink:#FFFFFF; --amber:#F2A900; --glass:#DCEBF6; --glass-on:#FFF1A8;
  --good:#16774A; --good-bg:#DCF2E5; --bad:#B03520; --bad-bg:#FBE3DD; --warn:#8A5A00; --warn-bg:#FFF0C7;
  --wireA:#D43F2E; --wireB:#2B3340; --batt:#EA8A2A; --metal:#B9C4CF; --metal2:#8D9AA8; --room:#1B2535;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620; --surface:#17222F; --surface2:#1F2E3F; --ink:#E8EFF6; --ink2:#B5C4D4; --muted:#9DB0C4; --line:#2E4157;
    --brand:#7DB8F5; --brand-ink:#0E1620; --amber:#F7B731; --glass:#2A3B4F; --glass-on:#FFE88A;
    --good:#78D9A3; --good-bg:#16382A; --bad:#FF9E8C; --bad-bg:#42201B; --warn:#F7CF73; --warn-bg:#3B3010;
    --wireA:#FF6B58; --wireB:#B8C4D3; --metal:#7E8C9B; --metal2:#5E6B79; --room:#0A101A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#17222F; --surface2:#1F2E3F; --ink:#E8EFF6; --ink2:#B5C4D4; --muted:#9DB0C4; --line:#2E4157;
  --brand:#7DB8F5; --brand-ink:#0E1620; --amber:#F7B731; --glass:#2A3B4F; --glass-on:#FFE88A;
  --good:#78D9A3; --good-bg:#16382A; --bad:#FF9E8C; --bad-bg:#42201B; --warn:#F7CF73; --warn-bg:#3B3010;
  --wireA:#FF6B58; --wireB:#B8C4D3; --metal:#7E8C9B; --metal2:#5E6B79; --room:#0A101A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.7 var(--font);word-break:keep-all;overflow-wrap:break-word}
button,select,textarea,input{font:inherit;color:inherit}
.wrap{max-width:920px;margin-inline:auto;padding-inline:16px}

/* 위쪽 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{flex:none;width:34px;height:34px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:1rem;line-height:1.25}
.ttl span{display:block;font-size:.82rem;color:var(--muted);line-height:1.3}
.prog{display:flex;gap:4px;padding-bottom:6px}
.prog button{flex:1;min-width:0;background:none;border:0;padding:7px 0;cursor:pointer}
.prog i{display:block;height:8px;border-radius:4px;background:var(--line)}
.prog .done i{background:var(--brand)}
.prog .cur i{background:var(--amber);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--amber)}
.btn{min-height:46px;padding:8px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.9rem;border-radius:10px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#delbar{background:var(--bad-bg);border-top:1px solid var(--bad);padding-block:12px}
#delbar p{margin:0 0 10px;font-weight:700;color:var(--bad)}
#delbar .acts{display:flex;gap:8px;flex-wrap:wrap}

/* 본문 */
main{padding-block:20px 130px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card.soft{background:var(--surface2);border-color:transparent}
h1{font-size:clamp(1.6rem,5.2vw,2.2rem);line-height:1.3;margin:4px 0 12px;text-wrap:balance;font-weight:800}
h2{font-size:1.3rem;line-height:1.35;margin:0 0 10px;text-wrap:balance;font-weight:800}
h3{font-size:1.08rem;margin:0 0 8px;font-weight:800}
p{margin:0 0 10px}
.eyebrow{font-size:.85rem;font-weight:800;letter-spacing:.04em;color:var(--brand);margin:0}
.phase{display:inline-block;font-size:.8rem;font-weight:800;letter-spacing:.06em;background:var(--amber);color:#2A1D00;border-radius:99px;padding:2px 12px;margin-bottom:8px}
.muted{color:var(--muted)}
.cap{font-size:.92rem;color:var(--muted);text-align:center;margin:8px 0 0}
.q{font-weight:800}
.room{background:var(--room);border-radius:16px;padding:10px;margin-top:12px;--glass:#2F3F57;--metal:#7E8C9B;--metal2:#566475;--wireB:#A9B6C7;--ink:#E6EEF7;--ink2:#9FB0C4;--muted:#9FB0C4}
.room svg{max-width:320px;margin-inline:auto;display:block}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.goal li{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;font-size:.75rem;font-weight:800;border-radius:6px;padding:1px 8px;margin-top:4px;background:var(--surface2);color:var(--brand)}
.flowchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.flowchips span{background:var(--surface2);border-radius:99px;padding:3px 14px;font-weight:700;font-size:.95rem}
textarea{width:100%;min-height:92px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--brand)}
select{min-height:44px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);max-width:100%}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin-top:3px;accent-color:var(--brand)}
.check.sel{border-color:var(--brand)}
.check.ok{border-color:var(--good);background:var(--good-bg)}
.check.no{border-color:var(--bad);background:var(--bad-bg)}
.check.miss{border-color:var(--amber);background:var(--warn-bg)}
.why{display:block;font-size:.9rem;margin-top:2px;color:var(--ink2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:84px;min-height:46px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ctl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ctl .lab{font-weight:800}
.ctl .lab small{font-weight:600;color:var(--muted)}
.wdot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px}
.stage svg{display:block;max-width:340px;margin-inline:auto}
svg{width:100%;height:auto;display:block}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:5px 16px;font-weight:800}
.badge::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor}
.badge.on{background:var(--warn-bg);color:var(--warn);border:2px solid var(--amber)}
.badge.off{background:var(--surface2);color:var(--muted);border:2px solid var(--line)}
.status{margin-top:10px;text-align:center}
.status p{margin:6px 0 0;font-size:.95rem;color:var(--ink2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-size:.85rem}
tr:last-child td{border-bottom:0}
td.res.on{color:var(--warn);font-weight:800}
.grid8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mini{border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.mini.on{border-color:var(--amber)}
.mini h4{margin:0;font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini .two button{min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.85rem;padding:2px 4px;line-height:1.25}
.mini .two button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.mini .res{font-size:.85rem;line-height:1.4;text-align:center}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.board{grid-template-columns:1fr}}
.box{border-radius:14px;padding:12px;min-height:84px;border:2px dashed var(--line)}
.box.on{border-color:var(--amber);background:var(--warn-bg)}
.box h3{font-size:.98rem}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums b{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:1.1rem}
.fb{font-weight:800;font-size:.92rem}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.note{background:var(--warn-bg);border-radius:12px;padding:12px 14px;font-size:.95rem;color:var(--ink)}
.note b{color:var(--warn)}
.say{background:var(--good-bg);border-radius:12px;padding:12px 14px}
.oxrow{display:flex;gap:8px}
.oxrow button{flex:1;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:1.1rem;cursor:pointer}
.oxrow button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px;min-width:0}
.rowsel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0}
.rowsel .n{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:800;display:grid;place-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pgrid .stage{padding:6px}
.pgrid svg{max-width:260px}
.ev{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
.sum span{font-size:.88rem;color:var(--muted)}
.quote{border-left:5px solid var(--amber);padding:6px 14px;margin:8px 0;background:var(--bg);border-radius:0 10px 10px 0}
.pdfmsg{font-weight:700;font-size:.92rem;margin:10px 0 0;color:var(--ink)}
#delbar .pdfmsg{margin:8px 0 0;font-size:.9rem}

/* 아래 이전/다음 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nav .btn{min-height:52px;font-size:1.05rem}
.nav .mid{font-size:.85rem;color:var(--muted);text-align:center;line-height:1.3;min-width:70px}
.nav .btn:last-child{justify-self:stretch}

/* SVG 부품 색 */
.f-batt{fill:var(--batt)} .f-metal{fill:var(--metal)} .f-metal2{fill:var(--metal2)}
.st{stroke:var(--ink2);stroke-width:2.5}
.thread{stroke:var(--metal2);stroke-width:2.5;fill:none}
.bulb-glass{fill:var(--glass);stroke:var(--ink2);stroke-width:3}
.bulb-glass.on{fill:var(--glass-on);stroke:var(--amber)}
.fil{fill:none;stroke:var(--ink2);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.fil.on{stroke:#FF8A00;stroke-width:3.5}
.hid{fill:none;stroke:var(--ink2);stroke-width:2;stroke-dasharray:4 4;opacity:.7}
.sym{font:800 26px var(--font);fill:#fff;text-anchor:middle}
.lbl{font:700 15px var(--font);fill:var(--muted)}
.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#FFD84D;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 13;animation:fl 1s linear infinite}
.flow.rev{animation-name:flr}
@keyframes fl{to{stroke-dashoffset:-14}}
@keyframes flr{to{stroke-dashoffset:14}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:1 6}}
.hs circle{fill:var(--brand)} .hs text{fill:var(--brand-ink);font:800 15px var(--font);text-anchor:middle}
.hs line{stroke:var(--brand);stroke-width:2.5}
.lever{stroke:var(--ink2);stroke-width:6;stroke-linecap:round}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="row">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="16" r="11" style="fill:var(--amber)"/><rect x="14" y="26" width="12" height="8" rx="2" style="fill:var(--metal2)"/><path d="M16 17l2-4 2 4 2-4 2 4" style="fill:none;stroke:#2A1D00;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/></svg>
      <div class="ttl"><b>전구에 불 켜기 탐구</b><span id="where"></span></div>
      <button class="btn sm danger" id="delbtn" type="button">내 기록 삭제</button>
    </div>
    <div class="prog" id="prog" role="tablist" aria-label="수업 단계"></div>
  </div>
  <div id="delbar" hidden>
    <div class="wrap">
      <p>내 기록을 모두 지울까요? 지운 기록은 되돌릴 수 없어요.</p>
      <div class="acts"><button class="btn sm" id="delpdf" type="button">PDF로 먼저 저장하기</button><button class="btn sm dangerfill" id="delyes" type="button">네, 모두 지울게요</button><button class="btn sm" id="delno" type="button">아니요</button></div>
      <p class="pdfmsg"></p>
    </div>
  </div>
</header>

<div class="wrap"><main id="main" aria-live="polite"></main></div>

<nav class="nav" aria-label="이전 다음">
  <div class="wrap">
    <button class="btn" id="prev" type="button">‹ 이전</button>
    <div class="mid" id="mid"></div>
    <button class="btn pri" id="next" type="button">다음 ›</button>
  </div>
</nav>

<script>
(function(){
'use strict';
var KEY='bulb-circuit-lesson-g6-v1';
var CIRC=['①','②','③','④','⑤','⑥','⑦','⑧'];
var PL={'꼭지쇠':'꼭지쇠','꼭지':'꼭지','유리':'유리 부분'};
var PN={'+':'(+)극','-':'(−)극','none':'연결 안 함'};
var STEPS=[
 {n:'탐구 문제 확인',p:'문제 확인'},{n:'전기 부품 살펴보기',p:'관찰'},{n:'예상하기',p:'예상'},
 {n:'회로 만들어 보기',p:'탐구·조작'},{n:'회로 카드로 확인하기',p:'관찰'},{n:'규칙 찾기',p:'규칙 발견'},
 {n:'과학적으로 설명하기',p:'설명'},{n:'개념 확인하기',p:'확인'},{n:'한 걸음 더',p:'확장'},{n:'정리하기',p:'정리'}
];
var ATT={'꼭지쇠':{R:[224,146],L:[176,146]},'꼭지':{R:[210,182],L:[190,182]},'유리':{R:[244,92],L:[156,92]}};
function W(a){return a.map(function(x){return {part:x[0],pole:x[1]};});}
var CARDS=[
 W([['꼭지쇠','+'],['꼭지','-']]), W([['꼭지쇠','+'],['꼭지','none']]), W([['꼭지쇠','+'],['꼭지쇠','-']]), W([['꼭지쇠','+'],['꼭지','+']]),
 W([['꼭지쇠','-'],['꼭지','+']]), W([['꼭지','+'],['꼭지','-']]), W([['유리','+'],['꼭지','-']]), W([['꼭지쇠','-'],['꼭지','-']])
];

/* ---------- 상태 저장 (이 브라우저 안에서만) ---------- */
function blank(){return {step:0,exp:[],expT:'',guess:'',parts:{},pred:{},predWhy:'',
  sim:{a:'꼭지쇠',b:'꼭지',bp:'none'},rec:[],rev:{},r1:[],r2:[],r1n:0,r2n:0,r1c:false,r2c:false,rule:'',
  build:{c:'',p:'',q:''},bc:false,shown:false,ex7:'both',
  quiz:{q1:'',q2:[null,null,null,null],q3:['',''],q4:['','']},qc:{},
  sw:{closed:true,tried:false,why:'',txt:'',show:false},ev:{}};}
var S=load();
function load(){try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);return Object.assign(blank(),o);}}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function wipe(){try{localStorage.removeItem(KEY);}catch(e){}S=blank();}
function setPath(p,v){var k=p.split('.'),o=S;for(var i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]];}o[k[k.length-1]]=v;}
var ui={msg:'',hint2:false};

/* ---------- 회로 그림 ---------- */
function isLit(w){
  if(w.some(function(x){return x.pole==='none';}))return false;
  var a=w.map(function(x){return x.part;}).sort().join(),b=w.map(function(x){return x.pole;}).sort().join();
  return a==='꼭지,꼭지쇠'&&b==='+,-';
}
function sides(w){
  var s=[null,null];
  w.forEach(function(x,i){if(x.pole==='+')s[i]='R';else if(x.pole==='-')s[i]='L';});
  w.forEach(function(x,i){if(s[i]===null){var o=s[1-i];s[i]=o==='L'?'R':o==='R'?'L':(i===0?'L':'R');}});
  return s;
}
var uid=0;
function circuit(w,o){
  o=o||{};
  var id='gl'+(uid++),lit=!o.off&&isLit(w),sd=sides(w),seen={};
  var att=w.map(function(x,i){
    var key=x.part+sd[i],k=seen[key]||0;seen[key]=k+1;
    var p=ATT[x.part][sd[i]],px=p[0],py=p[1];
    if(x.part==='꼭지')px+=(sd[i]==='R'?8:-8)*k;else py+=14*k;
    return [px,py];
  });
  var rail=[0,0],endY=[0,0],rk=[0,0];
  ['R','L'].forEach(function(s){
    var idx=[0,1].filter(function(i){return sd[i]===s;}).sort(function(a,b){return att[a][1]-att[b][1];});
    idx.forEach(function(i,p){rk[i]=p;});
    if(idx.length===1){rail[idx[0]]=s==='R'?340:58;endY[idx[0]]=315;}
    if(idx.length===2){rail[idx[0]]=s==='R'?352:48;endY[idx[0]]=323;rail[idx[1]]=s==='R'?330:70;endY[idx[1]]=307;}
  });
  var d=w.map(function(x,i){
    var s='M'+att[i][0]+' '+att[i][1];
    if(x.part==='꼭지')s+=' V'+(205+16*rk[i]);
    s+=' H'+rail[i];
    if(x.pole==='none')s+=' V268';else s+=' V'+endY[i]+' H'+(x.pole==='+'?294:120);
    return s;
  });

/* ---------- 단계별 화면 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function phase(t){return '<span class="phase">'+t+'</span>';}

function s1(){
  var ex=['어두운 곳에서 손전등을 켜 본 적이 있어요.','저녁에 스위치를 눌러 방에 전등을 켠 적이 있어요.'];
  return '<section class="card">'+phase('문제 확인')+'<p class="eyebrow">과학 6-2 · 3. 전기의 이용</p><h1>전구에 불을 켜려면 어떻게 해야 할까요?</h1>'+
  '<p>어두운 방에서는 전등을 켜서 주위를 밝혀요. 잠자기 전에는 전등을 꺼서 주위를 어둡게 해요. 전구에 불은 어떻게 켜질까요? 전지, 전구, 전선을 연결해서 전구에 불이 켜지는 조건을 알아봐요.</p>'+
  '<div class="room">'+circuit(W([['꼭지쇠','none'],['꼭지','none']]),{labels:true})+'</div><p class="cap">전지, 전구, 전선이 있어요. 아직 전구에 불이 켜지지 않았어요.</p></section>'+
  '<section class="card"><h2>오늘 알아볼 것</h2><ul class="plain goal">'+
  '<li><span class="tag">태도</span><span>전구에 불이 켜지는 조건을 적극적으로 찾아봐요.</span></li>'+
  '<li><span class="tag">탐구</span><span>전지, 전구, 전선을 연결해 불을 켜 보고, 불이 켜지는 전기 회로와 켜지지 않는 전기 회로를 비교해요.</span></li>'+
  '<li><span class="tag">지식</span><span>전구에 불이 켜지는 전기 회로의 특징을 설명해요.</span></li></ul>'+
  '<div class="flowchips"><span>예상하기</span>›<span>관찰하기</span>›<span>설명하기</span></div></section>'+
  '<section class="card"><h2>내 경험 떠올리기</h2><p class="q">전구에 불을 켜 본 경험을 이야기해 볼까요?</p><div style="display:grid;gap:8px;margin-bottom:14px">'+
  ex.map(function(t,i){var on=S.exp.indexOf(i)>=0;return '<label class="check'+(on?' sel':'')+'"><input type="checkbox" data-chk="exp" data-id="'+i+'"'+(on?' checked':'')+'><span>'+t+'</span></label>';}).join('')+'</div>'+
  '<p class="q">어떻게 했을 때 전구에 불이 켜지기도 하고 꺼지기도 할까요? 내 생각을 써 봐요.</p>'+ta('guess',S.guess,'생각나는 대로 써 보세요.',3)+
  '<p class="muted" style="margin:10px 0 0;font-size:.9rem">이름이나 번호는 쓰지 않아요. 쓴 내용은 이 기기의 브라우저에만 저장돼요.</p></section>';
}

var ANS={1:'(+)극',2:'(−)극',3:'필라멘트',4:'꼭지쇠',5:'꼭지',6:'집게'};
var NAMES6=['(+)극','(−)극','필라멘트','꼭지쇠','꼭지','집게'];
function s2(){
  var rows='';

  '<div class="pgrid"><div class="stage"><p class="cap" style="margin:0 0 4px">전지</p>'+partBattery()+'</div><div class="stage"><p class="cap" style="margin:0 0 4px">전구</p>'+partBulb()+'</div><div class="stage"><p class="cap" style="margin:0 0 4px">집게 달린 전선</p>'+partWire()+'</div></div></section>'+
  '<section class="card"><h3>이름 고르기</h3>'+rows+'<p class="muted" style="margin:6px 0 0">맞힌 이름: '+ok+' / 6</p>'+
  '<div style="margin-top:10px"><button class="btn sm" data-act="hint2" type="button">'+(ui.hint2?'힌트 닫기':'힌트 보기')+'</button></div>'+
  (ui.hint2?'<div class="note" style="margin-top:10px">전지에서 볼록하게 튀어나온 부분이 (+)극, 평평한 부분이 (−)극이에요. 전구에서 금속으로 된 옆면은 꼭지쇠, 아랫부분은 꼭지라고 해요. 전선은 끝부분에 집게가 있어요.</div>':'')+'</section>';
}

  '<section class="card"><div class="grid8">'+cards+'</div></section>'+

}

function ruleList(g,list,title,desc){
  var sel=S[g],chk=S[g+'c'],att=S[g+'n'];
  var items=list.map(function(it){
    var on=sel.indexOf(it.id)>=0,cls='check',why='';
    if(chk){
      if(on&&it.ok){cls+=' ok';why='<span class="why">맞아요. '+it.w+'</span>';}
      else if(on&&!it.ok){cls+=' no';why='<span class="why">다시 생각해 봐요.'+(att>=2?' '+it.w:' 카드와 내 기록을 다시 살펴봐요.')+'</span>';}
      else if(!on&&it.ok&&att>=2){cls+=' miss';why='<span class="why">빠뜨렸어요. '+it.w+'</span>';}
    }else if(on)cls+=' sel';
    return '<label class="'+cls+'"><input type="checkbox" data-chk="'+g+'" data-id="'+it.id+'"'+(on?' checked':'')+'><span>'+it.t+why+'</span></label>';
  }).join('');
  var wrong=0,miss=0;
  list.forEach(function(it){var on=sel.indexOf(it.id)>=0;if(on&&!it.ok)wrong++;if(!on&&it.ok)miss++;});
  var sum='';
  if(chk){
    if(!wrong&&!miss)sum='<p class="fb ok" style="margin:10px 0 0">모두 맞게 골랐어요!</p>';
    else sum='<p class="fb no" style="margin:10px 0 0">'+(wrong?'틀리게 고른 것이 '+wrong+'개 있어요. ':'')+(miss?'빠뜨린 것이 있어요. ':'')+'다시 골라 보세요.</p>';
  }
  return '<section class="card"><h2>'+title+'</h2><p>'+desc+'</p><div style="display:grid;gap:8px">'+items+'</div>'+
  '<div style="margin-top:12px"><button class="btn pri" type="button" data-act="rcheck" data-g="'+g+'">확인하기</button></div>'+sum+'</section>';
}

  }catch(e){
    var c=e&&e.code;
    setPdfMsg(c==='declined'?'저장하지 않았어요. 필요하면 다시 눌러요.':c==='rate_limited'?'잠시 뒤에 다시 눌러 주세요.':'PDF를 저장하지 못했어요. 다시 눌러 보세요.',true);
  }
  pdfBusy=false;
}

var VIEWS=[s1,s2,s3,s4,s5,s6,s7,s8,s9,s10];
var main=document.getElementById('main');

function render(keepScroll){
  var y=window.scrollY;
  main.innerHTML=VIEWS[S.step]();
  var st=STEPS[S.step];
  document.getElementById('where').textContent=(S.step+1)+' / '+STEPS.length+' · '+st.n;
  document.getElementById('mid').textContent=(S.step+1)+' / '+STEPS.length;
  document.getElementById('prev').disabled=S.step===0;
  var nx=document.getElementById('next');
  nx.textContent=S.step===STEPS.length-1?'처음으로':'다음 ›';
  document.getElementById('prog').innerHTML=STEPS.map(function(s,i){
    return '<button type="button" role="tab" data-go="'+i+'" class="'+(i<S.step?'done':i===S.step?'cur':'')+'" aria-label="'+(i+1)+'단계 '+s.n+'" aria-selected="'+(i===S.step)+'"><i></i></button>';
  }).join('');
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));ui.msg='';save();render(false);}

document.getElementById('prev').addEventListener('click',function(){go(S.step-1);});
document.getElementById('next').addEventListener('click',function(){go(S.step===STEPS.length-1?0:S.step+1);});
document.getElementById('prog').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(+b.dataset.go);});
var delbar=document.getElementById('delbar');
function askDel(){delbar.hidden=false;}
document.getElementById('delbtn').addEventListener('click',askDel);
document.getElementById('delno').addEventListener('click',function(){delbar.hidden=true;});
document.getElementById('delpdf').addEventListener('click',function(){makePdf();});
document.getElementById('delyes').addEventListener('click',function(){wipe();ui={msg:'',hint2:false};setPdfMsg('');delbar.hidden=true;render(false);});

function toggleIn(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
function simUpdate(){var el=document.getElementById('simwrap');if(el)el.innerHTML=simHTML();}

main.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,d=t.dataset;
  if(a==='hint2'){ui.hint2=!ui.hint2;render(true);}
  else if(a==='pred'){S.pred[d.i]=d.v;save();render(true);}
  else if(a==='sim'){S.sim[d.k]=d.v;ui.msg='';save();simUpdate();}
  else if(a==='simreset'){S.sim={a:'꼭지쇠',b:'꼭지',bp:'none'};ui.msg='';save();simUpdate();}
  else if(a==='simrec'){
    var s=S.sim,dup=S.rec.some(function(r){return r.a===s.a&&r.b===s.b&&r.bp===s.bp;});
    if(dup)ui.msg='같은 연결은 이미 기록했어요. 다른 연결을 해 봐요.';
    else if(S.rec.length>=20)ui.msg='기록은 20개까지 할 수 있어요. 필요 없는 기록을 지워 봐요.';
    else{S.rec.push({a:s.a,b:s.b,bp:s.bp,lit:isLit(simCfg())});ui.msg='';}
    save();simUpdate();
  }
  else if(a==='recdel'){S.rec.splice(+d.i,1);save();simUpdate();}
  else if(a==='rev'){S.rev[d.i]=true;save();render(true);}
  else if(a==='revall'){for(var i=1;i<=8;i++)S.rev[i]=true;save();render(true);}
  else if(a==='rcheck'){S[d.g+'c']=true;S[d.g+'n']=(S[d.g+'n']||0)+1;save();render(true);}
  else if(a==='bcheck'){S.bc=true;save();render(true);}
  else if(a==='showexp'){S.shown=!S.shown;save();render(true);}
  else if(a==='ex7'){S.ex7=d.v;save();render(true);}
  else if(a==='q2'){S.quiz.q2[+d.i]=d.v;S.qc.q2=false;save();render(true);}
  else if(a==='qcheck'){S.qc[d.q]=true;save();render(true);}
  else if(a==='swtoggle'){S.sw.closed=!S.sw.closed;S.sw.tried=true;save();render(true);}
  else if(a==='swshow'){S.sw.show=!S.sw.show;save();render(true);}
  else if(a==='ev'){S.ev[d.k]=d.v;save();render(true);}
  else if(a==='pdf'){makePdf();}
  else if(a==='delask'){askDel();window.scrollTo(0,0);}
  else if(a==='restart'){go(0);}
});
main.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.chk){
    var g=t.dataset.chk;
    if(g==='exp'){toggleIn(S.exp,+t.dataset.id);}
    else{toggleIn(S[g],t.dataset.id);S[g+'c']=false;}
    save();render(true);return;
  }
  if(t.dataset.model){
    setPath(t.dataset.model,t.value);
    if(t.dataset.qid)S.qc[t.dataset.qid]=false;
    if(t.dataset.model.indexOf('build.')===0)S.bc=false;
    save();
    if(t.dataset.re||t.dataset.qid||t.dataset.model.indexOf('build.')===0)render(true);
  }
});
main.addEventListener('input',function(e){
  var t=e.target;
  if(t.tagName==='TEXTAREA'&&t.dataset.model){setPath(t.dataset.model,t.value);save();}
});

render(false);
})();
</script>
